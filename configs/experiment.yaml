# The three-way comparison this whole project hinges on, plus eval settings.

# All three conditions run through the SAME script
# (src/adbench/training/train.py), selected via --condition:
#     python -m adbench.training.train --condition base
#     python -m adbench.training.train --condition sft_only
#     python -m adbench.training.train --condition distilled
# `checkpoint` is where that condition's LoRA adapter is saved (and where
# evaluation/run_eval.py loads it back from); `base` still goes through
# train.py (loads the student, attaches a freshly-initialized, untrained
# LoRA adapter, saves immediately) rather than being special-cased, so
# run_eval.py's "load base model + adapter from checkpoint" path is
# identical across all three conditions — a fresh LoRA adapter is a
# mathematical no-op (B is zero-initialized) until trained, so this doesn't
# change base's behavior versus loading the bare hf_id.
conditions:
  - id: base
    label: "Base student (no fine-tuning)"
    checkpoint: checkpoints/base/

  - id: sft_only
    label: "SFT-only student (control)"
    checkpoint: checkpoints/sft_only/

  - id: distilled
    label: "Distillation-guided student (KD + SFT, treatment)"
    checkpoint: checkpoints/distilled/

  # ---- Controls: does the KD gain come from the teacher's knowledge, or from
  # regularisation that stops the student memorising 640 templated examples? ----
  # Same data, LoRA config, optimizer and seed handling as the conditions above;
  # only the listed fields differ.
  - id: sft_early
    label: "SFT stopped after one epoch (early-stopping control)"
    checkpoint: checkpoints/sft_early/
    loss: sft
    overrides:
      num_train_epochs: 1    # fixed a priori; the SFT loss is already ~1e-3 after ~40 steps

  - id: sft_ls
    label: "SFT with label smoothing (regularisation control)"
    checkpoint: checkpoints/sft_ls/
    loss: sft
    label_smoothing: 0.1

  - id: self_distill
    label: "KD from the frozen base student itself (no external knowledge)"
    checkpoint: checkpoints/self_distill/
    loss: kd
    teacher: teacher_self

  - id: distilled_8b
    label: "KD from a mid-size external teacher (Qwen3-8B)"
    checkpoint: checkpoints/distilled_8b/
    loss: kd
    teacher: teacher_8b

  # ---- Second model pair (does the finding generalise beyond one model size?) ----
  # Reuses "base"/"sft_only"/"distilled_8b" above as-is (student_small + teacher_8b
  # passed explicitly, see evaluation/second_pair_worker.py) — this condition exists
  # only because self-distillation needs a teacher pointed at student_small's OWN
  # base model (teacher_self above is the MAIN pair's 4B student, wrong for this
  # pair). checkpoint: is a harmless default; second_pair_worker.py always overrides it.
  - id: self_distill_small
    label: "KD from the frozen small student itself, second model pair"
    checkpoint: checkpoints/self_distill_small/
    loss: kd
    teacher: teacher_self_small

# Training hyperparameters — named here, not hardcoded in train.py, so
# they're easy to read, change, and sweep without touching code.
#
# sft_only and distilled share every field below EXCEPT the kd.* weights
# (sft_only always runs with kd_weight forced to 0 / sft_weight forced to 1
# regardless of what's written here — see train.py's resolve_training_config
# docstring — so the two conditions differ *only* in the loss function, per
# the README's three-way-comparison design). `base` does no training at all
# and ignores this whole block.
training:
  seed: 42
  learning_rate: 2.0e-4
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  warmup_ratio: 0.03
  weight_decay: 0.0
  lr_scheduler_type: cosine
  logging_steps: 10
  save_steps: 50

  # Only meaningfully used by the "distilled" condition (see above).
  kd:
    temperature: 2.0
    kd_weight: 0.5
    sft_weight: 0.5

  # Named hyperparameter variations for the "distilled" condition, applied
  # via `--sweep <name>` — each overrides one or more dotted keys in this
  # `training:` block on top of the base values above, so you can compare a
  # few settings without hand-editing this file each time:
  #     python -m adbench.training.train --condition distilled --sweep higher_kd_temp
  sweep:
    - name: baseline
      overrides: {}
    - name: higher_kd_temp
      overrides:
        kd.temperature: 4.0
    - name: kd_heavy
      overrides:
        kd.kd_weight: 0.8
        kd.sft_weight: 0.2
    - name: sft_heavy
      overrides:
        kd.kd_weight: 0.2
        kd.sft_weight: 0.8
    - name: lower_lr
      overrides:
        learning_rate: 5.0e-5

# Multi-step agentic harness settings (deliverable #2 / #4).
harness:
  chain_lengths: [1, 3, 5]
  # How many independent task instances to run per chain length per
  # condition — kept modest so the T4-hosted eval loop finishes in a
  # reasonable time; raise once the harness is validated.
  n_tasks_per_chain_length: 30
  inject_errors: true          # exercise the harness's error-handling path
  max_retries_per_step: 2
  # Also evaluate on this many held-out single-step tasks that use the TRAINING
  # tools (Glaive test split). Lets us see whether a condition is strong on tools
  # it was trained on but weak on new ones (memorisation) or not. 0 disables it.
  seen_tool_eval_n: 100

# General language-modeling comparison baseline (not agentic).
# Deliberately NOT the Glaive test split — that's entirely tool-calling text,
# which wouldn't isolate "got worse at everything" from "got worse
# specifically at agentic tool-use". Uses a small held-out general-text
# sample instead. Cached locally by adbench.data.general_eval (gitignored,
# like the other data/ subfolders).
general_lm_eval:
  metric: perplexity
  source:
    # NOT "wikitext" — that repo's loading script is no longer supported by
    # `datasets` >= 4 (raises HfUriError at load time). "Salesforce/wikitext"
    # is the maintained, script-free mirror with identical configs/content —
    # see adbench.data.general_eval's module docstring.
    hf_dataset: Salesforce/wikitext
    hf_config: wikitext-2-raw-v1
    split: test
  min_word_count: 10            # drops blank lines and heading-only rows
                                 # (e.g. " = = Career = = ") — see
                                 # adbench.data.general_eval's docstring
  n_samples: 200                # number of held-out text chunks to eval on
  seed: 42
  eval_set: data/general_eval/wikitext2_sample.jsonl

# Layer-wise activation comparison (deliverable #5).
#
# Two probe input sets, compared separately (analysis/layer_analysis.py
# tags every result row with which one it's from):
#   tool_use: the Glaive TEST split (data/splits/test.jsonl, real tool-call
#     text, formatted identically to training via
#     training.train.format_training_example) — held out from the
#     student's fine-tuning, same discipline as evaluation/run_eval.py.
#   general: the wikitext sample (data/general_eval/, same file
#     evaluation/perplexity.py uses) — the control: divergence here that
#     ALSO shows up on tool_use is generic distillation drift, not
#     tool-use-specific.
#
# Metrics: cka (Kornblith et al. linear CKA) and cosine_distance. Both are
# needed BECAUSE teacher/student hidden sizes differ (5120 vs 2560 — see
# configs/models.yaml) — plain cosine similarity between raw activation
# vectors isn't defined across mismatched dimensions, so cosine_distance
# here is computed between each model's own token-pair similarity
# structure (RSA-style), not raw vectors; see layer_analysis.py's module
# docstring for the full reasoning. Reported side by side as a robustness
# check on each other, not because either alone is known to be more
# correct for this comparison.
layer_analysis:
  n_probe_examples: 50
  probe_max_length: 128          # tokens per probe text (truncated if longer)
  seed: 42
  divergence_metrics:
    - cka
    - cosine_distance
  cache_dir: results/layer_analysis/activation_cache/
  results_path: results/layer_analysis/divergence.jsonl
