# Model identifiers and load settings for the two roles in the study.
# Both are loaded via Unsloth (FastLanguageModel) for 4-bit QLoRA training
# on a free Colab T4.

# Tokenizer compatibility: VERIFIED shared tokenizer (Qwen2Tokenizer,
# vocab_size=151643) via scripts/verify_tokenizer_compatibility.py — logit-
# level KD in training/losses.py relies on this holding.
tokenizer_compatibility:
  verified: true
  shared_tokenizer: true
  vocab_size: 151643
  checked_with: scripts/verify_tokenizer_compatibility.py
  # If this ever needs re-checking against a different model pair, rerun
  # that script — a mismatch means training/losses.py must switch from
  # logit-level KD to its sequence-level-distillation fallback.

teacher:
  hf_id: Qwen/Qwen3-14B
  role: teacher
  # Teacher is inference-only (produces logits/hidden states for KD) — no
  # gradient updates, so it can stay 4-bit quantized to fit alongside the
  # student on a single T4.
  load_in_4bit: true
  max_seq_length: 2048

# Alternative teachers for the control conditions (configs/experiment.yaml). Same
# shared tokenizer/vocabulary, so logit-level KD works unchanged.
teacher_8b:
  hf_id: Qwen/Qwen3-8B
  role: teacher
  load_in_4bit: true
  max_seq_length: 2048

# "Self" teacher: the base student itself, frozen. Its logits at step 0 equal the
# student's, so this KD term only anchors the student to where it started.
teacher_self:
  hf_id: Qwen/Qwen3-4B-Instruct-2507
  role: teacher
  load_in_4bit: true
  max_seq_length: 2048

# Second model pair (README/paper's "does the finding generalise beyond one model
# size?" check) — student_small + the existing teacher_8b, ~4.7x apart (vs the
# main pair's ~3.5x), and teacher_self_small for that pair's own self-distill
# control (must be the SMALL student's own base, not teacher_self above, which is
# the main pair's 4B student — self-distillation only makes sense against a
# model's own un-fine-tuned self).
#
# Tokenizer compatibility VERIFIED 2026-09 (scripts/verify_tokenizer_compatibility.py
# Qwen/Qwen3-8B vs Qwen/Qwen3-1.7B): identical Qwen2Tokenizer, vocab_size=151643
# (len=151669), matching special tokens, and matching token-id sequences across
# code/JSON/CJK samples — same guarantee as the main pair, logit-level KD is safe.
teacher_self_small:
  hf_id: Qwen/Qwen3-1.7B
  role: teacher
  load_in_4bit: true
  max_seq_length: 2048

student_small:
  hf_id: Qwen/Qwen3-1.7B
  role: student
  load_in_4bit: true
  max_seq_length: 2048
  lora:
    r: 16
    alpha: 16
    dropout: 0.0
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

student:
  hf_id: Qwen/Qwen3-4B-Instruct-2507
  role: student
  load_in_4bit: true
  max_seq_length: 2048
  # LoRA settings shared by both the SFT-only and distillation-guided runs,
  # so the only difference between conditions 2 and 3 is the loss function,
  # not the adapter capacity.
  lora:
    r: 16
    alpha: 16
    dropout: 0.0
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

# Layer-analysis notebook needs to know how to line up teacher/student layers
# even though they have different depths/hidden sizes.
#
# VERIFIED (via transformers.AutoConfig — config.json only, no weights
# downloaded) 2026-09:
#   Qwen3-14B:               num_hidden_layers=40, hidden_size=5120
#   Qwen3-4B-Instruct-2507:  num_hidden_layers=36, hidden_size=2560
#   Qwen3-8B (teacher_8b):   num_hidden_layers=36, hidden_size=4096
#   Qwen3-1.7B (student_small): num_hidden_layers=28, hidden_size=2048
# Both depth AND width differ, which is why cosine distance can't be taken
# directly between raw activation vectors (5120-dim vs 2560-dim) — see
# analysis/layer_analysis.py's module docstring for how it's handled instead.
#
# VERIFIED module structure (transformers.models.qwen3.modeling_qwen3, same
# installed package version used everywhere else, no weights needed):
# Qwen3ForCausalLM.model is a Qwen3Model with a `.layers` ModuleList of
# Qwen3DecoderLayer, each with `.self_attn.o_proj` (attention output
# projection) and `.mlp.down_proj` (FFN/MLP output projection) — the
# standard Llama-family layout. analysis/layer_analysis.py hooks these two
# submodules per layer to capture "attention output" and "FFN output"
# separately, not the combined residual stream. Found by locating modules
# whose name matches `...layers.<N>` via named_modules() (not a hardcoded
# attribute chain), so this keeps working if PEFT/Unsloth add wrapper
# attributes (e.g. `base_model.model.model.layers.0`) around the same
# underlying architecture.
layer_alignment:
  strategy: uniform_span  # map student layer i -> teacher layer round(i * teacher_layers/student_layers)
  compare:
    - attention
    - ffn
