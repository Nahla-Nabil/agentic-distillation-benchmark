# Model identifiers and load settings for the two roles in the study.
# Both are loaded via Unsloth (FastLanguageModel) for 4-bit QLoRA training
# on a free Colab T4.

# Tokenizer compatibility: VERIFIED shared tokenizer (Qwen2Tokenizer,
# vocab_size=151643) via scripts/verify_tokenizer_compatibility.py — logit-
# level KD in training/losses.py relies on this holding.
tokenizer_compatibility:
  verified: true
  shared_tokenizer: true
  vocab_size: 151643
  checked_with: scripts/verify_tokenizer_compatibility.py
  # If this ever needs re-checking against a different model pair, rerun
  # that script — a mismatch means training/losses.py must switch from
  # logit-level KD to its sequence-level-distillation fallback.

teacher:
  hf_id: Qwen/Qwen3-14B
  role: teacher
  # Teacher is inference-only (produces logits/hidden states for KD) — no
  # gradient updates, so it can stay 4-bit quantized to fit alongside the
  # student on a single T4.
  load_in_4bit: true
  max_seq_length: 2048

student:
  hf_id: Qwen/Qwen3-4B-Instruct-2507
  role: student
  load_in_4bit: true
  max_seq_length: 2048
  # LoRA settings shared by both the SFT-only and distillation-guided runs,
  # so the only difference between conditions 2 and 3 is the loss function,
  # not the adapter capacity.
  lora:
    r: 16
    alpha: 16
    dropout: 0.0
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

# Layer-analysis notebook needs to know how to line up teacher/student layers
# even though they have different depths/hidden sizes — filled in once we
# confirm each model's actual config (num_hidden_layers, hidden_size).
layer_alignment:
  strategy: uniform_span  # map student layer i -> teacher layer round(i * teacher_layers/student_layers)
  compare:
    - attention
    - ffn
